    <script>
        function play(player)
        {
            const choices=["rock","scissor","paper"];
            let computerchoice=choices[Math.floor(Math.random()*3)];
            document.getElementById("game").innerHTML=`You choose ${player}, Computer have choosen ${computerchoice}`;
            if(player===computerchoice)
            {

            document.getElementById("result").innerHTML="The Match is Draw";
            }
            else if(player==="rock" && computerchoice==="paper"){
            document.getElementById("result").innerHTML="Computer Wins😢";
            }
            else if(player==="paper" && computerchoice==="scissor"){
            document.getElementById("result").innerHTML="Computer Wins😢";
            }
            else if(player==="scissor" && computerchoice==="rock"){
            document.getElementById("result").innerHTML="Computer Wins😢";
            }
            else
            {
            document.getElementById("result").innerHTML="You Win🤩";
            }
            
        }
    </script>
